name: Build Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (Zip & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Assets and Package Electron App
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Portable Zip Exists
        shell: pwsh
        run: |
          if (Test-Path "dist-electron/win-unpacked") {
            Write-Host "Compressing win-unpacked directory into zip..."
            Compress-Archive -Path "dist-electron/win-unpacked/*" -DestinationPath "dist-electron/alaseel-cashier-app-win-x64.zip" -Force
          }
          Get-ChildItem -Path dist-electron

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alaseel-cashier-windows-x64
          path: |
            dist-electron/*.zip
            dist-electron/*.exe
          retention-days: 30
