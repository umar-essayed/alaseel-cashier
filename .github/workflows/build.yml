name: Build Application & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Zip & Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Assets and Package Electron App
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Portable Zip Exists
        shell: pwsh
        run: |
          if (Test-Path "dist-electron/win-unpacked") {
            Write-Host "Compressing win-unpacked directory into zip..."
            Compress-Archive -Path "dist-electron/win-unpacked/*" -DestinationPath "dist-electron/alaseel-cashier-app-win-x64.zip" -Force
          }
          Get-ChildItem -Path dist-electron

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alaseel-cashier-windows-x64
          path: |
            dist-electron/*.zip
            dist-electron/*.exe
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "الأصيل لقطع الغيار - الإصدار v1.0.${{ github.run_number }}"
          body: |
            ## 🎉 تحديث جديد: الأصيل لقطع غيار السيارات (v1.0.${{ github.run_number }})
            
            ### 🚀 أبرز التعديلات في هذا الإصدار:
            1. 🏷️ **تعديل خصم الفاتورة بعد البيع والتسليم:**
               - ميزة تعديل الخصم من سجل الفواتير مع تحديث الصافي.
               - تخفيض تلقائي لمديونية العميل الآجل في حال كانت الفاتورة بالآجل.
               - إمكانية إعادة طباعة الفاتورة بالخصم المحدث.
               - تسجيل العملية أمنياً في `activity_logs` والمزامنة السحابية.
            2. 📦 **خانة إجمالي ما دخل المخزن (تراكمي):**
               - عمود مخصص في جدول المخزون يعرض إجمالي ما ورد للمحل بالتفصيل `(المتاح حالياً + المباع)`.
               - كارت إحصائي علوي يعرض إجمالي تكلفة البضاعة الداخلة للمخزن.
            3. 📊 **كارت إجمالي تكلفة البضاعة الداخلة في لوحة التحليلات:**
               - `المخزون الحالي بالتكلفة + تكلفة ما تم بيعه` مطابق تماماً للتحليلات المحاسبية.
            4. 📈 **رسومات بيانية تفاعلية دقيقة (Offline 100%):**
               - منحنى تفاعلي ناعم لمتابعة المبيعات والأرباح اليومية مع فلاتر (7 أيام / 30 يوم / 90 يوم / الكل).
               - رسم بياني دائري لتوزيع قيمة المخزون حسب الفئات.
            
            ---
            ### 📥 ملفات التحميل:
            - **`alaseel-cashier-app-win-x64.zip`**: المجلد المضغوط الجاهز للتشغيل المباشر دون تثبيت.
            - **ملف التثبيت (Setup .exe)**: للتثبيت التلقائي مع عمل اختصار سطح المكتب.
          files: |
            dist-electron/*.zip
            dist-electron/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
